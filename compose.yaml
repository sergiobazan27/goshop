services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data:
