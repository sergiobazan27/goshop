services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local
    volumes:
      - keycloak_data:/opt/keycloak/data

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: goshop
      POSTGRES_USER: goshop
      POSTGRES_PASSWORD: goshop-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goshop -d goshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keycloak_data:
  postgres_data:
