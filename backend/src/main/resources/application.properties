# Configuración local de Keycloak
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/goshop
%dev.quarkus.oidc.application-type=service
%dev.quarkus.oidc.client-id=goshop-web

# Usamos nuestro contenedor de Keycloak
%dev.quarkus.keycloak.devservices.enabled=false

# Permitir Angular durante el desarrollo
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE
%dev.quarkus.http.cors.headers=Authorization,Content-Type
%dev.quarkus.http.cors.access-control-allow-credentials=false

# PostgreSQL local
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=goshop
%dev.quarkus.datasource.password=goshop-local
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/goshop

# Usar nuestro PostgreSQL de Compose
%dev.quarkus.datasource.devservices.enabled=false

%dev.quarkus.hibernate-orm.schema-management.strategy=update

# Cliente técnico para consultar usuarios en Keycloak
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8180
%dev.quarkus.keycloak.admin-client.realm=goshop
%dev.quarkus.keycloak.admin-client.client-id=goshop-backend
%dev.quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
%dev.quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
%dev.quarkus.keycloak.admin-client.username=
%dev.quarkus.keycloak.admin-client.password=
