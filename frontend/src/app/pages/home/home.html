<app-sidebar></app-sidebar>
<div
  class="min-h-dvh bg-[#f3f2f5] pb-[calc(74px+env(safe-area-inset-bottom,0px))] min-[681px]:ml-20 min-[681px]:pb-0 min-[951px]:ml-[200px] min-[1201px]:ml-56"
>
  <app-header></app-header>
  <main class="p-[18px] min-[681px]:p-6 min-[1201px]:p-9">
    <div
      class="mb-6 flex flex-wrap items-start justify-between gap-[18px] min-[681px]:mb-7 min-[681px]:flex-nowrap min-[681px]:items-center min-[681px]:gap-6"
    >
      <div>
        <h1
          class="text-[34px] leading-[1.1] font-semibold tracking-[-0.055em] text-[#362c40] min-[681px]:text-[clamp(32px,3.2vw,46px)]"
        >
          Todo listo para servir.
        </h1>
        <p class="mt-2.5 text-xs text-[#6c6375] min-[681px]:mt-3 min-[681px]:text-[13px]">
          Un vistazo a lo que pasa en tu negocio.
        </p>
      </div>
      <div class="flex shrink-0 items-center gap-5">
        <time
          datetime="2026-10-10"
          class="hidden text-xs whitespace-nowrap text-[#6c6375] min-[1201px]:block"
        >
          10 de octubre
        </time>
        <button
          type="button"
          class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-transparent bg-[#ffac7a] px-3.5 py-2.5 text-xs font-semibold whitespace-nowrap text-[#362c40] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#a7592f] min-[681px]:min-h-[46px] min-[681px]:px-[17px] min-[681px]:py-3 min-[681px]:text-[13px]"
        >
          <svg
            lucidePlus
            class="size-5 shrink-0"
            [size]="20"
            [strokeWidth]="1.7"
            aria-hidden="true"
          ></svg>
          Nuevo pedido
        </button>
      </div>
    </div>
    <app-service-summary></app-service-summary>
    <div
      class="grid items-start gap-5 min-[951px]:grid-cols-[minmax(0,1.6fr)_minmax(270px,1fr)] min-[1201px]:grid-cols-[minmax(0,1.75fr)_minmax(290px,1fr)] min-[1201px]:gap-[26px]"
    >
      <app-tables-overview></app-tables-overview>
      <div
        class="grid min-w-0 gap-5 min-[681px]:grid-cols-[minmax(0,1fr)_minmax(0,0.8fr)] min-[951px]:grid-cols-1"
      >
        <app-recent-orders></app-recent-orders>
        <section
          aria-label="Acceso al catálogo"
          class="flex flex-wrap items-center gap-3 rounded-[14px] bg-[#e8e0ef] px-[22px] py-[22px] text-[#362c40] min-[681px]:block min-[681px]:p-5 min-[951px]:flex min-[1201px]:px-6"
        >
          <svg
            lucidePackage
            [size]="20"
            [strokeWidth]="1.7"
            class="hidden shrink-0 text-[#655273] min-[1201px]:block"
            aria-hidden="true"
          ></svg>
          <div>
            <h3 class="text-sm font-semibold">Tu carta, siempre al día</h3>
            <p class="mt-1 text-xs text-[#6b5d76]">7 productos listos para pedir.</p>
          </div>
          <button
            type="button"
            class="ml-auto inline-flex min-h-11 items-center gap-1.5 text-xs font-semibold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#a7592f] min-[681px]:mt-4 min-[951px]:mt-0"
          >
            Editar carta
            <svg lucideArrowRight [size]="16" [strokeWidth]="1.7" aria-hidden="true"></svg>
          </button>
        </section>
      </div>
    </div>
    <section aria-labelledby="activity-heading" class="mt-7 text-[#362c40] min-[681px]:mt-[30px]">
      <div class="mb-4 flex items-center justify-between gap-3">
        <div>
          <h2
            id="activity-heading"
            class="text-[22px] leading-[1.3] font-semibold tracking-[-0.035em]"
          >
            Actividad del servicio
          </h2>
          <p class="mt-[5px] text-xs text-[#6c6375]">Todos los pedidos, en un solo lugar.</p>
        </div>
        <button
          type="button"
          class="inline-flex min-h-11 shrink-0 items-center gap-1.5 text-xs font-semibold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#a7592f]"
        >
          Ver actividad
          <svg lucideArrowRight [size]="16" [strokeWidth]="1.7" aria-hidden="true"></svg>
        </button>
      </div>
      <app-orders-table></app-orders-table>
    </section>
  </main>
  <app-footer></app-footer>
</div>
