<section
  aria-labelledby="recent-orders-heading"
  class="overflow-hidden rounded-2xl bg-white text-[#362c40]"
>
  <div
    class="flex items-center justify-between gap-3 px-[18px] pt-[22px] pb-[18px] min-[681px]:px-5 min-[1201px]:px-6 min-[1201px]:pt-6"
  >
    <div>
      <h2
        id="recent-orders-heading"
        class="text-[22px] leading-[1.3] font-semibold tracking-[-0.035em]"
      >
        Pedidos en curso
      </h2>
      <p class="mt-[5px] text-xs text-[#6c6375]">Los últimos pedidos que siguen abiertos.</p>
    </div>
    <svg lucideClock [size]="20" [strokeWidth]="1.7" class="shrink-0" aria-hidden="true"></svg>
  </div>
  @if (orders().length) {
    <ul class="px-[18px] min-[681px]:px-5 min-[1201px]:px-6">
      @for (order of orders(); track order.id) {
        <li><app-recent-order [order]="order"></app-recent-order></li>
      }
    </ul>
  } @else {
    <p class="px-6 pb-6 text-sm leading-relaxed text-[#6c6375]">
      No hay pedidos abiertos en este momento.
    </p>
  }
  <div
    class="flex items-center justify-between gap-3 border-t border-[#e5e1e9] px-[18px] py-[13px] text-xs min-[681px]:px-5 min-[1201px]:px-6"
  >
    <span class="text-[#6c6375]">Hasta 5 pedidos recientes</span
    ><a
      routerLink="/orders"
      class="inline-flex min-h-11 items-center gap-1.5 font-semibold focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#a7592f]"
      >Ver pedidos<svg lucideArrowRight [size]="16" [strokeWidth]="1.7" aria-hidden="true"></svg
    ></a>
  </div>
</section>
