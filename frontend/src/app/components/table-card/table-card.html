<a
  routerLink="/orders"
  [queryParams]="entry().orderId ? { orderId: entry().orderId } : { tableId: entry().table.id }"
  [attr.aria-label]="
    entry().table.name + ', ' + (entry().orderId ? 'ocupada, ver pedido' : 'libre, ver mesa')
  "
  [class]="
    'flex min-h-[118px] w-full flex-col rounded-[11px] border p-2.5 text-left focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#a7592f] min-[681px]:min-h-[125px] min-[681px]:p-3.5 min-[951px]:p-2.5 min-[1201px]:min-h-32 min-[1201px]:p-3.5 ' +
    (entry().orderId
      ? 'border-[#655273] bg-[#655273] text-white'
      : 'border-[#ded5e7] bg-white text-[#362c40]')
  "
>
  <span class="mb-1.5 text-xs font-medium">Mesa</span>
  <span
    class="mb-auto text-xl leading-tight font-semibold break-words tracking-[-0.035em] min-[1201px]:text-2xl"
    >{{ entry().table.name }}</span
  >
  <span class="mt-3 flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
    <span [class]="'text-xs ' + (entry().orderId ? 'text-[#e5ddeb]' : 'text-[#6c6375]')">
      @if (entry().orderId) {
        {{ entry().quantity }} unidades
      } @else {
        {{ entry().table.capacity }} {{ entry().table.capacity === 1 ? 'persona' : 'personas' }}
      }
    </span>
    <span
      [class]="
        'inline-flex items-center gap-[5px] text-[11px] ' +
        (entry().orderId ? 'text-white' : 'text-[#6c6375]')
      "
      ><span class="size-[5px] rounded-full bg-current" aria-hidden="true"></span
      >{{ entry().orderId ? 'Ocupada' : 'Libre' }}</span
    >
  </span>
</a>
