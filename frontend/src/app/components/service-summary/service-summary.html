<section
  aria-label="El servicio ahora"
  class="mb-6 flex flex-wrap items-center gap-x-4 gap-y-3 border-y border-[#ddd6e4] py-[15px] text-xs min-[681px]:mb-7 min-[681px]:gap-x-[22px] min-[681px]:gap-y-2.5 min-[681px]:py-4 min-[951px]:flex-nowrap min-[951px]:gap-[18px] min-[1201px]:gap-[26px]"
>
  <h2
    class="flex w-full items-center gap-2 font-semibold text-[#362c40] min-[951px]:w-auto min-[951px]:flex-1"
  >
    <span class="size-1.5 shrink-0 rounded-full bg-[#38644d]" aria-hidden="true"></span>El servicio,
    ahora
  </h2>
  <dl
    class="flex flex-wrap items-center gap-x-4 gap-y-3 min-[681px]:gap-x-[22px] min-[951px]:gap-[18px] min-[1201px]:gap-[26px]"
  >
    <div class="flex items-baseline gap-[5px] min-[681px]:gap-[7px]">
      <dt class="text-[#6c6375]">mesas ocupadas</dt>
      <dd class="order-first text-[17px] font-semibold text-[#362c40]">
        {{ metrics().occupiedTables }}/{{ metrics().totalTables }}
      </dd>
    </div>
    <div
      class="flex items-baseline gap-[5px] min-[681px]:gap-[7px] min-[951px]:border-l min-[951px]:border-[#ddd6e4] min-[951px]:pl-[18px] min-[1201px]:pl-6"
    >
      <dt class="text-[#6c6375]">pedidos abiertos</dt>
      <dd class="order-first text-[17px] font-semibold text-[#362c40]">
        {{ metrics().openOrders }}
      </dd>
    </div>
    <div
      class="flex items-baseline gap-[5px] min-[681px]:gap-[7px] min-[951px]:border-l min-[951px]:border-[#ddd6e4] min-[951px]:pl-[18px] min-[1201px]:pl-6"
    >
      <dt class="text-[#6c6375]">productos disponibles</dt>
      <dd class="order-first text-[17px] font-semibold text-[#362c40]">
        {{ metrics().availableProducts }}
      </dd>
    </div>
  </dl>
</section>
